# Compila el programa con Visual Studio (MSVC, 64 bits), ejecuta las pruebas en Linux
# y publica el programa listo para usar en "Releases" con un enlace fijo:
#   https://github.com/<dueño>/<repositorio>/releases/latest/download/BeneficioUnimax-windows-x64.zip
name: Compilar

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas (Linux + SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev libsqliteodbc
      - name: Compilar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 4
      - name: Ejecutar pruebas
        run: ./build/pruebas
      - name: Verificar plantillas de Excel
        run: |
          pip install openpyxl
          ./build/pruebas --nombres | python tools/verificar_plantillas.py

  windows:
    name: Programa de Windows (MSVC x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -S . -B build -A x64 -DBU_PRUEBAS=ON
      - name: Compilar
        run: cmake --build build --config Release
      - name: Preparar carpeta del programa
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/BeneficioUnimax.exe dist/
          Copy-Item build/Release/pruebas.exe dist/
          Copy-Item -Recurse plantillas dist/plantillas
          Copy-Item README.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: BeneficioUnimax-windows-x64
          path: dist

  publicar:
    name: Publicar descarga (Releases)
    needs: [pruebas, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BeneficioUnimax-windows-x64
          path: BeneficioUnimax
      - name: Crear el .zip
        run: zip -r BeneficioUnimax-windows-x64.zip BeneficioUnimax
      - name: Publicar la última versión
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notas.md <<'NOTAS'
          Programa listo para usar en Windows 10/11 de 64 bits (con Office de 64 bits: Excel y Access).

          **Instalación**
          1. Descargue `BeneficioUnimax-windows-x64.zip` (abajo, en *Assets*).
          2. Clic derecho en el .zip → *Extraer todo...* → por ejemplo en `C:\BeneficioUnimax`.
          3. Abra `BeneficioUnimax.exe`. Si Windows muestra *"Windows protegió su PC"*, haga clic en
             *Más información* → *Ejecutar de todas formas* (el programa no tiene firma digital comercial).
          4. Opcional: ejecute `pruebas.exe` para comprobar que el controlador de Access de su Office funciona.

          Mantenga `BeneficioUnimax.exe` y la carpeta `plantillas` juntos. Sus datos se guardan en
          `Documentos\BeneficioUnimax` y no se borran al actualizar el programa.
          NOTAS
          gh release delete ultima-version --yes --cleanup-tag || true
          gh release create ultima-version BeneficioUnimax-windows-x64.zip \
            --target "$GITHUB_SHA" --latest \
            --title "Beneficio Unimax: última versión ($(date -u +%Y-%m-%d))" \
            --notes-file notas.md
