# Compila el programa con Visual Studio (MSVC, 64 bits), ejecuta las pruebas en Linux
# y publica el programa listo para usar en "Releases" con un enlace fijo (un solo .exe):
#   https://github.com/<dueño>/<repositorio>/releases/latest/download/BeneficioUnimax.exe
name: Compilar

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas (Linux + SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev libsqliteodbc
      - name: Compilar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 4
      - name: Ejecutar pruebas
        run: ./build/pruebas
      - name: Verificar plantillas de Excel
        run: |
          pip install openpyxl
          ./build/pruebas --nombres | python tools/verificar_plantillas.py

  windows:
    name: Programa de Windows (MSVC x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        # Número de versión = número de compilación (lo usan las actualizaciones automáticas).
        # Los datos de la aplicación de Google (para conectar Google Drive) vienen de los "secrets"
        # del repositorio; si no existen, el usuario los escribe en el programa (Nube → Google Drive).
        env:
          BU_GOOGLE_CLIENT_ID: ${{ secrets.BU_GOOGLE_CLIENT_ID }}
          BU_GOOGLE_CLIENT_SECRET: ${{ secrets.BU_GOOGLE_CLIENT_SECRET }}
        # Las actualizaciones se descargan sin iniciar sesión, así que deben publicarse en un repositorio
        # PÚBLICO: este mismo, o uno aparte solo para descargas (variable BU_REPOSITORIO_DESCARGAS).
        run: >-
          cmake -S . -B build -A x64 -DBU_PRUEBAS=ON -DBU_VERSION=${{ github.run_number }}
          -DBU_REPOSITORIO=${{ vars.BU_REPOSITORIO_DESCARGAS || github.repository }}
      - name: Compilar
        run: cmake --build build --config Release
      - name: Preparar carpeta del programa
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/BeneficioUnimax.exe dist/
          Copy-Item build/Release/pruebas.exe dist/
          Copy-Item -Recurse plantillas dist/plantillas
          Copy-Item README.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: BeneficioUnimax-windows-x64
          path: dist

  publicar:
    name: Publicar descarga (Releases)
    needs: [pruebas, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BeneficioUnimax-windows-x64
          path: BeneficioUnimax
      - name: Crear el .zip
        run: zip -r BeneficioUnimax-windows-x64.zip BeneficioUnimax
      - name: Crear version.txt (para las actualizaciones automáticas)
        env:
          MENSAJE: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "version=${{ github.run_number }}"
            echo "sha256=$(sha256sum BeneficioUnimax/BeneficioUnimax.exe | cut -d' ' -f1)"
            echo "tamano=$(stat -c%s BeneficioUnimax/BeneficioUnimax.exe)"
            echo "---"
            if [ -n "$MENSAJE" ]; then printf '%s\n' "$MENSAJE" | { grep -v -E '^(Co-Authored-By|Claude-Session):' || true; }; else echo "Mejoras y correcciones."; fi
          } > version.txt
          cat version.txt
      - name: Publicar la última versión
        env:
          # Repositorio aparte para descargas (opcional): variable BU_REPOSITORIO_DESCARGAS y un token con
          # permiso de escritura en él, en el secreto BU_TOKEN_DESCARGAS.
          GH_TOKEN: ${{ secrets.BU_TOKEN_DESCARGAS || github.token }}
          GH_REPO: ${{ vars.BU_REPOSITORIO_DESCARGAS || github.repository }}
        run: |
          cat > notas.md <<'NOTAS'
          **Para abrir el programa:** descargue **`BeneficioUnimax.exe`** (abajo, en *Assets*) y ábralo.
          No hay que descomprimir nada: las plantillas de Excel van dentro del programa.

          1. Al terminar la descarga, haga clic en **Abrir archivo** (en la lista de descargas del navegador).
          2. Si Windows muestra *"Windows protegió su PC"*, haga clic en *Más información* → *Ejecutar de todas formas*
             (el programa no tiene firma digital comercial). Si el navegador avisa que el archivo "no se descarga
             con frecuencia", elija *Conservar*.
          3. El programa pregunta si desea instalarlo: elija **Sí** y se crea el ícono **Beneficio Unimax** en el
             escritorio. De ahí en adelante ábralo con doble clic en ese ícono.

          Requisitos: Windows 10/11 de 64 bits con Office de 64 bits (Excel y Access).
          **Actualizaciones:** el programa revisa al abrir si hay una versión nueva y la instala con un clic
          (menú *Ayuda → Buscar actualizaciones*). Sus datos (en `Documentos\BeneficioUnimax`) no cambian.

          Otros archivos: `pruebas.exe` comprueba que el controlador de Access de su Office funciona;
          el .zip trae lo mismo junto con el manual (README).
          NOTAS
          gh release delete ultima-version --yes --cleanup-tag || true
          gh release create ultima-version \
            BeneficioUnimax/BeneficioUnimax.exe BeneficioUnimax/pruebas.exe BeneficioUnimax-windows-x64.zip version.txt \
            $([ "$GH_REPO" = "$GITHUB_REPOSITORY" ] && echo "--target $GITHUB_SHA") --latest \
            --title "Beneficio Unimax: versión ${{ github.run_number }} ($(date -u +%Y-%m-%d))" \
            --notes-file notas.md
